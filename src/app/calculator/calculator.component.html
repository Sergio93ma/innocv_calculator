<div class="calculator">
  <div class="display-container">
    @if (hasError()) {
      <div class="error">{{ errorMessage() }}</div>
    }
    <div class="display" [class.has-error]="hasError()">{{ displayValue() }}</div>
  </div>

  <div class="buttons">
    @for (button of buttons; track button.label) {
      <button [class]="button.cssClass" (click)="button.handler()">
        {{ button.label }}
      </button>
    }
  </div>
</div>
